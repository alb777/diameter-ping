name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.22", "stable"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false # no dependencies
      - name: Load SCTP so the SCTP tests run instead of skipping
        run: sudo modprobe sctp || echo "no SCTP on this runner, the SCTP tests will skip"
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build for macOS and Windows
        run: GOOS=darwin go build ./... && GOOS=windows go build ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: interop/go.sum
      - run: sudo modprobe sctp || echo "no SCTP on this runner, the SCTP cases will skip"
      - name: dping against go-diameter
        working-directory: interop
        run: go test -race ./...
